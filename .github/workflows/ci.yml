name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only, pinned)
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only, pinned)
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Unit tests (synthetic, non-biometric fixtures)
        run: pytest
      - name: CLI dry-run smoke test
        run: frp plan examples/manifests/synthetic-dry-run.yaml --dry-run
      - name: Simulated pipeline smoke test (synthetic fixtures only)
        run: frp simulate examples/manifests/synthetic-dry-run.yaml --report-dir "$RUNNER_TEMP/frp-simulated-report"
