[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "frp"
version = "0.1.0"
description = "FRP CPU-only experiment harness: manifest validation and A/B/C/D dry-run planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17,<0.18",
]

[project.scripts]
frp = "frp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PT", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
